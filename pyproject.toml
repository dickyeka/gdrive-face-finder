[project]
name = "face-recognition-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for Face Detection and Recognition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.3.0",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dlib = [
    "face-recognition>=1.3.0",
]
opencv = [
    "opencv-python>=4.8.0",
]
all = [
    "face-recognition>=1.3.0",
    "opencv-python>=4.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
